# cmd_guard v1 parameters. Edit and re-launch — no image rebuild needed.
input_topic: "/cmd_vel_ros2_raw"
# ============================================================================
# WARNING: output_topic below is set to the REAL /cmd_vel — commands sent
# through cmd_guard CAN MOVE THE ROBOT. Before running with this setting you
# MUST confirm ALL of the following:
#   1. The stock joystick node's /cmd_vel is diverted, e.g.:
#        rosrun hexapod_teleop_joystick hexapod_teleop_joystick \
#          __name:=Hexapod_Teleop_Joystick cmd_vel:=/cmd_vel_joy_unused
#      so that cmd_guard is the SOLE publisher on /cmd_vel.
#      Verify with:  rostopic info /cmd_vel   (expect exactly one publisher)
#   2. Y/A arming still works — the joystick node must still publish /state.
#      That /state stream is your physical e-stop. Do NOT synthesize it in software.
#   3. Robot is on the floor with clear space around it.
# For motion-free testing, set this to /cmd_vel_safety_test_out instead.
# ============================================================================
output_topic: "/cmd_vel"   # was /cmd_vel_safety_test_out
max_linear_x: 0.03       # m/s
max_linear_y: 0.03       # m/s
max_angular_z: 0.10      # rad/s
watchdog_timeout: 0.4    # s
publish_rate: 20.0       # Hz
enabled: true
